name: cliniccare
description: ClinicCare – Sistem Informasi Kesehatan & Antrian Poliklinik
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # UI
  google_fonts: ^6.1.0
  fl_chart: ^0.68.0
  # State management
  provider: ^6.1.1
  # Local database
  sqflite: ^2.4.2+1
  path: ^1.9.1
  # Utils
  intl: ^0.19.0
  shared_preferences: ^2.2.2
  printing: ^5.12.0       # PDF export / cetak
  pdf: ^3.10.8
  csv: ^6.0.0
  uuid: ^4.3.3
  sqflite_common_ffi: ^2.4.0+3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
